[project]
name = "rapid-registry-schema"
version = "0.1.0"
description = "LinkML schema for RAPID TA1 rare disease registry data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "linkml>=1.9",
    "linkml-term-validator>=0.4.5",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
markers = ["network: needs the EBI Ontology Lookup Service"]
