      ASIAN:
        meaning: OMOP:8515
      BLACK_OR_AFRICAN_AMERICAN:
        meaning: OMOP:8516
      MIDDLE_EASTERN_OR_NORTH_AFRICAN:
        meaning: OMOP:38003615
      NATIVE_HAWAIIAN_OR_OTHER_PACIFIC_ISLANDER:
        meaning: OMOP:8557
      WHITE:
        meaning: OMOP:8527
      MORE_THAN_ONE_RACE:
        meaning: OMOP:45880900
      UNKNOWN:
        meaning: OMOP:45877986

  EthnicityEnum:
    description: US OMB ethnicity categories as OMOP concepts (copied from BDCHM EthnicityEnum).
    permissible_values:
      HISPANIC_OR_LATINO:
        meaning: OMOP:38003563
      NOT_HISPANIC_OR_LATINO:
        meaning: OMOP:38003564
      UNKNOWN:
        meaning: OMOP:45877986

  VitalStatusEnum:
    description: Vital status as OMOP concepts (copied from BDCHM VitalStatusEnum).
    permissible_values:
      ALIVE:
        meaning: OMOP:4230556
      DEAD:
        meaning: OMOP:434489
      UNKNOWN:

  ConditionSeverityEnum:
    description: Severity as OMOP concepts (copied from BDCHM ConditionSeverityEnum).
    permissible_values:
      MILD:
        meaning: OMOP:4116992
      MODERATE:
        meaning: OMOP:4285732
      SEVERE:
        meaning: OMOP:4087703

  FamilyRelationshipEnum:
    description: >-
      Relationship of a relative to the participant. The OMOP-coded values are
      copied from BDCHM FamilyRelationshipEnum; the rest have no OMOP code in
      that value set and are left unbound.
    permissible_values:
      SELF:
        meaning: OMOP:45884467
      NATURAL_PARENT:
        meaning: OMOP:4029630
      NATURAL_FATHER:
        meaning: OMOP:4321888
      NATURAL_MOTHER:
        meaning: OMOP:4277283
      NATURAL_SIBLING:
        meaning: OMOP:4218412
      NATURAL_BROTHER:
        meaning: OMOP:4263682
      NATURAL_SISTER:
        meaning: OMOP:4251326
      NATURAL_CHILD:
        meaning: OMOP:4326600
      BLOOD_RELATIVE:
        meaning: OMOP:4053608
      HALF_SIBLING:
      TWIN:
      GRANDPARENT:
      AUNT_OR_UNCLE:
      COUSIN:
